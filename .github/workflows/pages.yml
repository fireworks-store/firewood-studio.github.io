
name: Build and deploy FireWood Studio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Silex website
        run: |
          sh build.sh

      - name: Fix website paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          base = "/firewood-studio.github.io"

          pattern = re.compile(
              r'(?P<prefix>(?:href|src|poster|action)\s*=\s*["\']|url\(\s*["\']?)'
              r'(?P<path>/(?!/)[^"\')\s]*)',
              re.IGNORECASE
          )

          for file in Path("_site").rglob("*"):
              if file.is_file() and file.suffix.lower() in (".html", ".css"):
                  content = file.read_text(encoding="utf-8")
                  fixed = pattern.sub(
                      lambda m: m.group("prefix") + base + m.group("path"),
                      content
                  )

                  if content != fixed:
                      file.write_text(fixed, encoding="utf-8")
                      print(f"Fixed: {file}")

          PY

          touch _site/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
